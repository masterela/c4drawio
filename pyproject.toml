[project]
name = "c4drawio"
version = "0.1.0"
description = "C4-style YAML <-> draw.io diagrams: automatic layout, obstacle-avoiding orthogonal routing, themes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
c4drawio = "c4drawio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c4drawio"]
